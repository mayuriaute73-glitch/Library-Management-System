<!DOCTYPE html>
<html>
<head>
  <title>Issued Books - Library System</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background-color: #e6f2ff;
    }

    header {
      background-color: #3399ff;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logout-btn {
      background-color: white;
      color: #3399ff;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    .logout-btn:hover {
      background-color: #f0f0f0;
    }

    nav {
      background-color: #cce6ff;
      padding: 15px;
      text-align: center;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    nav a {
      text-decoration: none;
      color: #003366;
      font-weight: bold;
      padding: 10px 15px;
      border-radius: 5px;
      transition: all 0.3s;
    }

    nav a:hover {
      background-color: #99ccff;
      color: #000;
    }

    .container {
      padding: 20px;
    }

    .form-box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 350px;
      margin-bottom: 30px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    input {
      width: 100%;
      padding: 8px;
      margin: 8px 0;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #3399ff;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      font-weight: bold;
      margin-top: 5px;
    }

    button:hover {
      background-color: #0073e6;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    th, td {
      padding: 10px;
      border: 1px solid #ccc;
      text-align: center;
      font-size: 14px;
    }

    th {
      background-color: #3399ff;
      color: white;
    }

    .action-btn {
      padding: 5px 10px;
      margin: 2px;
      border: none;
      cursor: pointer;
      border-radius: 4px;
      font-size: 12px;
    }

    .return {
      background-color: green;
      color: white;
    }

    .delete {
      background-color: red;
      color: white;
    }
  </style>
</head>

<body>

  <header>
    🔁 Issued Books Management
    <button class="logout-btn" onclick="logout()" type="button">Logout</button>
  </header>

  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="users.html">Users</a>
    <a href="books.html">Books</a>
    <a href="issued.html">Issued Books</a>
    <a href="fine.html">Fine Management</a>
  </nav>

  <div class="container">

    <!-- Issue Book Form -->
    <div class="form-box">
      <h3>Issue Book</h3>

      <input type="number" id="user_id" placeholder="User ID">
      <input type="number" id="book_id" placeholder="Book ID">
      <input type="date" id="issue_date">
      <input type="date" id="return_date">


      <button type="button" onclick="issueBook()">Issue Book</button>
    </div>

    <!-- Issued Books Table -->
    <h3>Issued Books List</h3>

    <table>
      <thead>
        <tr>
          <th>User ID</th>
          <th>Book ID</th>
          <th>Issue Date</th>
          <th>Return Date</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody id="issuedTable"></tbody>
    </table>

  </div>

  <script src="script.js"></script>
  <script>
    function issueBook() {
      const user_id = document.getElementById("user_id").value.trim();
      const book_id = document.getElementById("book_id").value.trim();
      const issue_date = document.getElementById("issue_date").value;
      const return_date = document.getElementById("return_date").value;

      // Validation
      if (!user_id || !book_id || !issue_date || !return_date) {
        alert("Please fill in all fields");
        return;
      }

      const data = {
        user_id: parseInt(user_id),
        book_id: parseInt(book_id),
        issue_date: issue_date,
        return_date: return_date
      };

      fetch("http://localhost:5000/issue", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
      })
      .then(res => {
        if (!res.ok) {
          return res.text().then(text => {
            throw new Error("Server error: " + res.status + " - " + text);
          });
        }
        return res.json();
      })
      .then(data => {
        if (data && data.success) {
          // Clear form
          document.getElementById("user_id").value = "";
          document.getElementById("book_id").value = "";
          document.getElementById("issue_date").value = "";
          document.getElementById("return_date").value = "";
          
          alert("Book issued successfully");
          loadIssued();
        } else {
          alert("Error issuing book: " + (data && data.message ? data.message : "Unknown error"));
        }
      })
      .catch(error => {
        console.error("Full error:", error);
        alert("Error issuing book: " + error.message);
      });
    }

    function deleteIssued(id) {
      if (confirm("Are you sure you want to delete this issued book record?")) {
        fetch("http://localhost:5000/issue/" + id, {
          method: "DELETE"
        })
        .then(res => {
          if (!res.ok) {
            return res.text().then(text => {
              throw new Error("Server error: " + res.status + " - " + text);
            });
          }
          return res.json();
        })
        .then(data => {
          if (data && data.success) {
            alert("Book issued record deleted successfully!");
            loadIssued();
          } else {
            alert("Error deleting record: " + (data && data.message ? data.message : "Unknown error"));
          }
        })
        .catch(error => {
          console.error("Error:", error);
          alert("Error deleting record: " + error.message);
        });
      }
    }

    function returnBook(issueId, userId) {
      const today = new Date().toISOString().split('T')[0];
      
      const data = {
        issue_id: issueId,
        user_id: userId,
        return_actual_date: today
      };

      fetch("http://localhost:5000/issue/" + issueId + "/return", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
      })
      .then(res => {
        if (!res.ok) {
          return res.text().then(text => {
            throw new Error("Server error: " + res.status + " - " + text);
          });
        }
        return res.json();
      })
      .then(data => {
        if (data && data.success) {
          let message = "Book returned successfully!";
          if (data.fine_generated) {
            message += `\n\nFine Generated: ₹${data.fine_amount}\nDays Late: ${data.days_late}`;
          }
          alert(message);
          loadIssued();
        } else {
          alert("Error returning book: " + (data && data.message ? data.message : "Unknown error"));
        }
      })
      .catch(error => {
        console.error("Error:", error);
        alert("Error returning book: " + error.message);
      });
    }

    function loadIssued() {
      fetch("http://localhost:5000/issue")
        .then(res => {
          if (!res.ok) {
            throw new Error("Server error: " + res.status);
          }
          return res.json();
        })
        .then(data => {
          const table = document.getElementById("issuedTable");
          table.innerHTML = "";

          if (Array.isArray(data)) {
            data.forEach(item => {
              const status = item.status || 'Issued';
              const statusColor = status === 'Returned' ? 'green' : 'orange';
              const actionBtn = status === 'Issued' 
                ? `<button class="action-btn return" type="button" onclick="returnBook(${item.id}, ${item.user_id})">Return Book</button>`
                : '<span style="color: green; font-weight: bold;">Returned</span>';
              
              table.innerHTML += `
                <tr>
                  <td>${item.user_id || '-'}</td>
                  <td>${item.book_id || '-'}</td>
                  <td>${item.issue_date || '-'}</td>
                  <td>${item.return_date || '-'}</td>
                  <td><span style="color: ${statusColor}; font-weight: bold;">${status}</span></td>
                  <td>${actionBtn}</td>
                </tr>
              `;
            });
          }
        })
        .catch(error => {
          console.error("Error loading issued books:", error);
          document.getElementById("issuedTable").innerHTML = "<tr><td colspan='6'>Error loading data</td></tr>";
        });
    }

    // Load data when page opens
    loadIssued();
  </script>

</body>
</html>
