<!DOCTYPE html>
<html>
<head>
  <title>Library Management - Register & Login</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #e6f2ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: white;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 100%;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      color: #3399ff;
      margin: 0 0 10px 0;
      font-size: 28px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
      border-bottom: 2px solid #e6f2ff;
    }

    .tab-button {
      flex: 1;
      padding: 12px;
      border: none;
      background-color: transparent;
      color: #666;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.3s;
    }

    .tab-button.active {
      color: #3399ff;
      border-bottom-color: #3399ff;
    }

    .tab-button:hover {
      color: #3399ff;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .form-group {
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #cce6ff;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }

    input:focus {
      outline: none;
      border-color: #3399ff;
      background-color: #f9fcff;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #3399ff;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
      margin-top: 10px;
    }

    button:hover {
      background-color: #0073e6;
    }

    button:active {
      transform: scale(0.98);
    }

    .message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📚 Library System</h1>
    </div>

    <div class="tabs">
      <button class="tab-button active" onclick="switchTab('register')">Register</button>
      <button class="tab-button" onclick="switchTab('login')">Login</button>
    </div>

    <!-- Register Tab -->
    <div id="register" class="tab-content active">
      <div class="form-group">
        <input type="text" id="regName" placeholder="Enter Full Name">
      </div>
      <div class="form-group">
        <input type="email" id="regEmail" placeholder="Enter Email Address">
      </div>
      <div class="form-group">
        <input type="text" id="regPhone" placeholder="Enter Phone (10 digits)">
      </div>
      <div class="form-group">
        <input type="password" id="regPassword" placeholder="Enter Password">
      </div>
      <div class="form-group">
        <input type="password" id="regConfirmPassword" placeholder="Confirm Password">
      </div>
      <button type="button" onclick="register()">Register Now</button>
      <p class="message">Already have an account? <a href="#" onclick="switchTab('login'); return false;" style="color: #3399ff; text-decoration: none; font-weight: bold;">Login</a></p>
    </div>

    <!-- Login Tab -->
    <div id="login" class="tab-content">
      <div class="form-group">
        <input type="email" id="email" placeholder="Enter Email Address">
      </div>
      <div class="form-group">
        <input type="password" id="password" placeholder="Enter Password">
      </div>
      <button type="button" onclick="login()">Login</button>
      <p class="message">Don't have an account? <a href="#" onclick="switchTab('register'); return false;" style="color: #3399ff; text-decoration: none; font-weight: bold;">Register</a></p>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    function switchTab(tab) {
      // Hide all tabs
      document.getElementById('register').classList.remove('active');
      document.getElementById('login').classList.remove('active');
      
      // Remove active class from all buttons
      document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
      
      // Show selected tab
      document.getElementById(tab).classList.add('active');
      
      // Mark the correct button as active based on tab parameter
      const buttons = document.querySelectorAll('.tab-button');
      if (tab === 'register') {
        buttons[0].classList.add('active');
      } else if (tab === 'login') {
        buttons[1].classList.add('active');
      }
    }
  </script>
</body>
</html>
