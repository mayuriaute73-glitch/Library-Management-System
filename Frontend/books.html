<!DOCTYPE html>
<html>
<head>
  <title>Books - Library System</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background-color: #e6f2ff;
    }

    header {
      background-color: #3399ff;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 24px;
    }

    .container {
      padding: 20px;
    }

    .form-box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 350px;
      margin-bottom: 30px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    input {
      width: 100%;
      padding: 8px;
      margin: 8px 0;
    }

    button {
      padding: 10px;
      background-color: #3399ff;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }

    button:hover {
      background-color: #0073e6;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    th, td {
      padding: 10px;
      border: 1px solid #ccc;
      text-align: center;
      font-size: 14px;
    }

    th {
      background-color: #3399ff;
      color: white;
    }

    .action-btn {
      padding: 5px 10px;
      margin: 2px;
      border: none;
      cursor: pointer;
      border-radius: 4px;
    }

    .edit {
      background-color: orange;
      color: white;
    }

    .delete {
      background-color: red;
      color: white;
    }
  </style>
</head>

<body>

  <header>📚 Book Management</header>

  <div class="container">

    <!-- Add Book Form -->
    <div class="form-box">
      <h3>Add Book</h3>

      <input type="text" id="title" placeholder="Title">
      <input type="text" id="author" placeholder="Author">

      <button type="button" onclick="addBook()">Add Book</button>
    </div>

    <!-- Books Table -->
    <h3>Books List</h3>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Author</th>
          <th>Available</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody id="bookTable"></tbody>
    </table>

  </div>

  <script>
    function addBook() {
      // Get form values
      const title = document.getElementById("title").value.trim();
      const author = document.getElementById("author").value.trim();

      // Validation
      if (!title || !author) {
        alert("Please fill in Title and Author");
        return;
      }

      const book = {
        title: title,
        author: author
      };

      fetch("http://localhost:5000/books", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(book)
      })
      .then(res => {
        if (!res.ok) {
          return res.text().then(text => {
            throw new Error("Server error: " + res.status + " - " + text);
          });
        }
        return res.json();
      })
      .then(data => {
        if (data && data.message) {
          // Clear form
          document.getElementById("title").value = "";
          document.getElementById("author").value = "";
          
          // Reload books list
          loadBooks();
          alert("Book added successfully!");
        } else {
          alert("Error adding book: " + (data && data.message ? data.message : "Invalid response"));
        }
      })
      .catch(error => {
        console.error("Full error:", error);
        alert("Error adding book: " + error.message);
      });
    }

    function editBook(id, title, author) {
      const newTitle = prompt("Edit Title:", title);
      if (newTitle === null) return;

      const newAuthor = prompt("Edit Author:", author);
      if (newAuthor === null) return;

      const data = {
        title: newTitle,
        author: newAuthor
      };

      fetch("http://localhost:5000/books/" + id, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
      })
      .then(res => {
        if (!res.ok) {
          return res.text().then(text => {
            throw new Error("Server error: " + res.status + " - " + text);
          });
        }
        return res.json();
      })
      .then(data => {
        if (data && data.success) {
          alert("Book updated successfully!");
          loadBooks();
        } else {
          alert("Error updating book: " + (data && data.message ? data.message : "Unknown error"));
        }
      })
      .catch(error => {
        console.error("Error:", error);
        alert("Error updating book: " + error.message);
      });
    }

    function deleteBook(id) {
      if (confirm("Are you sure you want to delete this book?")) {
        fetch("http://localhost:5000/books/" + id, {
          method: "DELETE"
        })
        .then(res => {
          if (!res.ok) {
            return res.text().then(text => {
              throw new Error("Server error: " + res.status + " - " + text);
            });
          }
          return res.json();
        })
        .then(data => {
          if (data && data.success) {
            alert("Book deleted successfully!");
            loadBooks();
          } else {
            alert("Error deleting book: " + (data && data.message ? data.message : "Unknown error"));
          }
        })
        .catch(error => {
          console.error("Error:", error);
          alert("Error deleting book: " + error.message);
        });
      }
    }

    function loadBooks() {
      fetch("http://localhost:5000/books")
        .then(res => {
          if (!res.ok) {
            throw new Error("Server error: " + res.status);
          }
          return res.json();
        })
        .then(data => {
          const table = document.getElementById("bookTable");
          table.innerHTML = "";

          if (Array.isArray(data)) {
            data.forEach(book => {
              const availableStatus = book.available ? '✓ Yes' : '✗ No';
              table.innerHTML += `
                <tr>
                  <td>${book.id || '-'}</td>
                  <td>${book.title || '-'}</td>
                  <td>${book.author || '-'}</td>
                  <td>${availableStatus}</td>
                  <td>
                    <button class="action-btn edit" type="button" onclick="editBook(${book.id}, '${book.title}', '${book.author}')">Edit</button>
                    <button class="action-btn delete" type="button" onclick="deleteBook(${book.id})">Delete</button>
                  </td>
                </tr>
              `;
            });
          }
        })
        .catch(error => {
          console.error("Error loading books:", error);
          document.getElementById("bookTable").innerHTML = "<tr><td colspan='5'>Error loading books</td></tr>";
        });
    }

    // Load books on page open
    loadBooks();
  </script>

</body>
</html>
