  <div class="container">

    <!-- Add User Form -->
    <div class="form-box">
      <h3>Add User</h3>

      <input type="text" id="name" placeholder="Full Name" required>
      <input type="email" id="email" placeholder="Email Address" required>
      <input type="tel" id="phone" placeholder="Phone Number (10 digits)" pattern="[0-9]{10}" required title="Please enter a 10-digit phone number">
      <button type="button" onclick="addUser()">Add User</button>
    </div>

    <!-- Users Table -->
    <h3>Users List</h3>

    <table>
      <thead>
        <tr>
          <th>UserId</th>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody id="userTable">
        <!-- Data will come here -->
      </tbody>
    </table>

  </div>

  <script src="script.js"></script>
  <script>
    function addUser() {
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();

      // Validation
      if (!name || !email || !phone) {
        alert("Please fill in all fields");
        return;
      }

      // Email validation - only @gmail.com allowed
      if (!email.endsWith("@gmail.com")) {
        alert("Invalid email: Only @gmail.com email addresses are allowed");
        return;
      }

      // Phone validation - only 10 digits allowed
      if (!/^\d{10}$/.test(phone)) {
        alert("Invalid phone: Phone number must be exactly 10 digits");
        return;
      }

      const user = {
        name: name,
        email: email,
        phone: phone
      };

      fetch("http://localhost:5000/users", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(user)
      })
      .then(res => {
        if (!res.ok) {
          return res.text().then(text => {
            throw new Error("Server error: " + res.status + " - " + text);
          });
        }
        return res.json();
      })
      .then(data => {
        if (data && (data.success || data.id)) {
          // Clear form
          document.getElementById("name").value = "";
          document.getElementById("email").value = "";
          document.getElementById("phone").value = "";
          
          // Reload users list
          loadUsers();
          alert("User added successfully!");
        } else {
          alert("Error adding user: " + (data && data.message ? data.message : "Invalid response"));
        }
      })
      .catch(error => {
        console.error("Full error:", error);
        alert("Error adding user: " + error.message);
      });
    }

    function editUser(id, name, email, phone) {
      const newName = prompt("Edit Name:", name);
      if (newName === null) return;

      const newEmail = prompt("Edit Email:", email);
      if (newEmail === null) return;

      if (!newEmail.endsWith("@gmail.com")) {
        alert("Invalid email: Only @gmail.com email addresses are allowed");
        return;
      }

      const newPhone = prompt("Edit Phone (10 digits):", phone);
      if (newPhone === null) return;

      if (!/^\d{10}$/.test(newPhone)) {
        alert("Invalid phone: Phone number must be exactly 10 digits");
        return;
      }

      const data = {
        name: newName,
        email: newEmail,
        phone: newPhone
      };

      fetch("http://localhost:5000/users/" + id, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
      })
      .then(res => {
        if (!res.ok) {
          return res.text().then(text => {
            throw new Error("Server error: " + res.status + " - " + text);
          });
        }
        return res.json();
      })
      .then(data => {
        if (data && data.success) {
          alert("User updated successfully!");
          loadUsers();
        } else {
          alert("Error updating user: " + (data && data.message ? data.message : "Unknown error"));
        }
      })
      .catch(error => {
        console.error("Error:", error);
        alert("Error updating user: " + error.message);
      });
    }

    function deleteUser(id) {
      if (confirm("Are you sure you want to delete this user?")) {
        fetch("http://localhost:5000/users/" + id, {
          method: "DELETE"
        })
        .then(res => {
          if (!res.ok) {
            return res.text().then(text => {
              throw new Error("Server error: " + res.status + " - " + text);
            });
          }
          return res.json();
        })
        .then(data => {
          if (data && data.success) {
            alert("User deleted successfully!");
            loadUsers();
          } else {
            alert("Error deleting user: " + (data && data.message ? data.message : "Unknown error"));
          }
        })
        .catch(error => {
          console.error("Error:", error);
          alert("Error deleting user: " + error.message);
        });
      }
    }

    function loadUsers() {
      fetch("http://localhost:5000/users")
        .then(res => {
          if (!res.ok) {
            throw new Error("Server error: " + res.status);
          }
          return res.json();
        })
        .then(data => {
          const table = document.getElementById("userTable");
          table.innerHTML = "";

          if (Array.isArray(data)) {
            data.forEach((user, index) => {
              table.innerHTML += `
                <tr>
                  <td>${user.id || index + 1}</td>
                  <td>${user.name || '-'}</td>
                  <td>${user.email || '-'}</td>
                  <td>${user.phone || '-'}</td>
                  <td>
                    <button class="action-btn edit" type="button" onclick="editUser(${user.id}, '${user.name}', '${user.email}', '${user.phone}')">Edit</button>
                    <button class="action-btn delete" type="button" onclick="deleteUser(${user.id})">Delete</button>
                  </td>
                </tr>
              `;
            });
          }
        })
        .catch(error => {
          console.error("Error loading users:", error);
          document.getElementById("userTable").innerHTML = "<tr><td colspan='5'>Error loading users</td></tr>";
        });
    }

    // Load users on page open
    loadUsers();
  </script>

</body>

<script>
    function loadUsers() {
      fetch("http://localhost:5000/users")
      .then(res => res.json())
      .then(data => {
      const table = document.getElementById("userTable");
      table.innerHTML = "";

      data.forEach(user => {
        table.innerHTML += `
          <tr>
            <td>${user.id}</td>
            <td>${user.name}</td>
            <td>${user.email}</td>
            <td>${user.password}</td>
          </tr>
        `;
      });
    })
    .catch(err => console.log(err));
}

window.onload = loadUsers;
</script>
    // Load users when page opens
    loadUsers();
  </script>
