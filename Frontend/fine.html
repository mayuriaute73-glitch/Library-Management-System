<!DOCTYPE html>
<html>
<head>
  <title>Fine Management - Library System</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background-color: #e6f2ff;
    }

    header {
      background-color: #3399ff;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logout-btn {
      background-color: white;
      color: #3399ff;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    .logout-btn:hover {
      background-color: #f0f0f0;
    }

    nav {
      background-color: #cce6ff;
      padding: 15px;
      text-align: center;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    nav a {
      text-decoration: none;
      color: #003366;
      font-weight: bold;
      padding: 10px 15px;
      border-radius: 5px;
      transition: all 0.3s;
    }

    nav a:hover {
      background-color: #99ccff;
      color: #000;
    }

    .container {
      padding: 20px;
    }

    .form-box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 350px;
      margin-bottom: 30px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    input {
      width: 100%;
      padding: 8px;
      margin: 8px 0;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #3399ff;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      font-weight: bold;
      margin-top: 5px;
    }

    button:hover {
      background-color: #0073e6;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    th, td {
      padding: 10px;
      border: 1px solid #ccc;
      text-align: center;
    }

    th {
      background-color: #3399ff;
      color: white;
    }

    .paid-btn {
      background-color: green;
      color: white;
      padding: 5px 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .paid-btn:hover {
      background-color: darkgreen;
    }

    .status-paid {
      color: green;
      font-weight: bold;
    }

    .status-unpaid {
      color: red;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header>
    💰 Fine Management
    <button class="logout-btn" onclick="logout()" type="button">Logout</button>
  </header>

  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="users.html">Users</a>
    <a href="books.html">Books</a>
    <a href="issued.html">Issued Books</a>
    <a href="fine.html">Fine Management</a>
  </nav>

  <div class="container">

    <!-- Fine Form -->
    <div class="form-box">
      <h3>Add Fine</h3>

      <input type="number" id="user_id" placeholder="UserId">
      <input type="number" id="issue_id" placeholder="Issue ID">
      <input type="number" id="days_late" placeholder="Days Late">
      <input type="number" id="amount" placeholder="Amount">

      <button type="button" onclick="calculateFine()">Calculate Fine</button>
      <button type="button" onclick="addFine()">Add Fine</button>
    </div>

    <!-- Fine Table -->
    <h3>Fine List</h3>

    <table>
      <thead>
        <tr>
          <th>Fine ID</th>
          <th>UserId</th>
          <th>Issue ID</th>
          <th>Days Late</th>
          <th>Amount</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody id="fineTable"></tbody>
    </table>

  </div>

  <script src="script.js"></script>
  <script>
    // Auto calculate fine (₹10 per day)
    function calculateFine() {
      const daysLateInput = document.getElementById("days_late");
      const amountInput = document.getElementById("amount");
      
      const days = parseInt(daysLateInput.value);
      
      if (!days || days <= 0) {
        alert("Please enter a valid number of days late");
        return;
      }
      
      const amount = days * 10;
      amountInput.value = amount;
      alert("Fine calculated: ₹" + amount);
    }

    function addFine() {
      const user_id = document.getElementById("user_id").value;
      const issue_id = document.getElementById("issue_id").value;
      const days_late = document.getElementById("days_late").value;
      const amount = document.getElementById("amount").value;

      console.log("Adding fine with:", { user_id, issue_id, days_late, amount });

      // Validation
      if (!user_id || user_id <= 0) {
        alert("Please enter a valid UserId");
        return;
      }

      if (!issue_id || issue_id <= 0) {
        alert("Please enter a valid Issue ID");
        return;
      }
      
      if (!days_late || days_late <= 0) {
        alert("Please enter valid Days Late");
        return;
      }
      
      if (!amount || amount <= 0) {
        alert("Please enter a valid Amount or click Calculate Fine first");
        return;
      }

      const data = {
        user_id: parseInt(user_id),
        issue_id: parseInt(issue_id),
        days_late: parseInt(days_late),
        amount: parseFloat(amount),
        status: "Unpaid"
      };

      console.log("Sending data to backend:", data);

      fetch("http://localhost:5000/fine", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
      })
      .then(res => {
        console.log("Response status:", res.status);
        if (!res.ok) {
          return res.text().then(text => {
            throw new Error("Server error: " + res.status + " - " + text);
          });
        }
        return res.json();
      })
      .then(data => {
        console.log("Response data:", data);
        if (data && data.success) {
          // Clear form
          document.getElementById("user_id").value = "";
          document.getElementById("issue_id").value = "";
          document.getElementById("days_late").value = "";
          document.getElementById("amount").value = "";
          
          alert("Fine added successfully");
          loadFines();
        } else {
          alert("Error adding fine: " + (data && data.message ? data.message : "Unknown error"));
        }
      })
      .catch(error => {
        console.error("Full error:", error);
        alert("Error adding fine: " + error.message);
      });
    }

    function markAsPaid(fineId) {
      fetch("http://localhost:5000/fine/" + fineId, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ status: "Paid" })
      })
      .then(res => {
        if (!res.ok) {
          throw new Error("Server error: " + res.status);
        }
        return res.json();
      })
      .then(data => {
        if (data && data.success) {
          alert("Fine marked as paid");
          loadFines();
        }
      })
      .catch(error => {
        console.error("Error:", error);
        alert("Error marking fine as paid: " + error.message);
      });
    }

    function loadFines() {
      fetch("http://localhost:5000/fine")
        .then(res => {
          if (!res.ok) {
            throw new Error("Server error: " + res.status);
          }
          return res.json();
        })
        .then(data => {
          const table = document.getElementById("fineTable");
          table.innerHTML = "";

          if (Array.isArray(data)) {
            data.forEach(fine => {
              const statusClass = fine.status === "Paid" ? "status-paid" : "status-unpaid";
              table.innerHTML += `
                <tr>
                  <td>${fine.id || '-'}</td>
                  <td>${fine.user_id || '-'}</td>
                  <td>${fine.issue_id || '-'}</td>
                  <td>${fine.days_late || '-'}</td>
                  <td>₹${fine.amount || '-'}</td>
                  <td><span class="${statusClass}">${fine.status || '-'}</span></td>
                  <td>
                    ${fine.status === "Unpaid" ? `<button class="paid-btn" type="button" onclick="markAsPaid(${fine.id})">Mark Paid</button>` : '<span>Paid</span>'}
                  </td>
                </tr>
              `;
            });
          }
        })
        .catch(error => {
          console.error("Error loading fines:", error);
          document.getElementById("fineTable").innerHTML = "<tr><td colspan='7'>Error loading fines</td></tr>";
        });
    }

    // Load fines on page open
    loadFines();
  </script>

</body>
</html>
